version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "16:00"
      timezone: America/Vancouver
    open-pull-requests-limit: 10
    groups:
      npm-nonbreaking:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "16:30"
      timezone: America/Vancouver
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
