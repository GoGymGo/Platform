name: Frontend CI

on:
  pull_request:
    paths:
      - "mobile-app/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "mobile-app/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npx expo install --check
      - run: npm audit --omit=dev
      - run: npx expo export --platform all --output-dir .expo-ci-export
        env:
          CI: "1"
      - run: npm run audit:production-bundle -- .expo-ci-export
