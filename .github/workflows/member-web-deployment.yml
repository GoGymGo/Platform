name: Member Web Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
      source_commit:
        description: Full 40-character Git commit SHA to build and deploy
        required: true
        type: string
  workflow_call:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        type: string
      source_commit:
        description: Full 40-character Git commit SHA to build and deploy
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: member-web-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    env:
      API_URL: ${{ vars.API_URL }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      MEMBER_WEB_BUCKET: ${{ vars.MEMBER_WEB_BUCKET }}
      MEMBER_WEB_DEPLOY_ROLE_ARN: ${{ vars.MEMBER_WEB_DEPLOY_ROLE_ARN }}
      MEMBER_WEB_DISTRIBUTION_ID: ${{ vars.MEMBER_WEB_DISTRIBUTION_ID }}
      MEMBER_WEB_URL: ${{ vars.MEMBER_WEB_URL }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_ENABLE_APPLE_AUTH: "false"
      EXPO_PUBLIC_ENABLE_BROWSER_TEST_PREVIEW: "false"
      EXPO_PUBLIC_ENABLE_CREATOR_FEATURES: ${{ vars.EXPO_PUBLIC_ENABLE_CREATOR_FEATURES || 'false' }}
      EXPO_PUBLIC_ENABLE_GOOGLE_AUTH: "false"
      GOGYMGO_BROWSER_ONLY_PILOT: "true"
    steps:
      - name: Validate protected environment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            API_URL \
            AWS_ACCOUNT_ID \
            AWS_REGION \
            MEMBER_WEB_BUCKET \
            MEMBER_WEB_DEPLOY_ROLE_ARN \
            MEMBER_WEB_DISTRIBUTION_ID \
            MEMBER_WEB_URL \
            EXPO_PUBLIC_FIREBASE_API_KEY \
            EXPO_PUBLIC_FIREBASE_APP_ID \
            EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN \
            EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            EXPO_PUBLIC_FIREBASE_PROJECT_ID \
            EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET; do
            if [[ -z "${!name:-}" ]]; then
              echo "The protected environment must define ${name}." >&2
              exit 1
            fi
          done
          if [[ "$AWS_REGION" != "ca-central-1" ]]; then
            echo "GoGymGo releases are restricted to ca-central-1." >&2
            exit 1
          fi
          if [[ "$API_URL" != "https://api-staging.gogymgo.com" && "${{ inputs.environment }}" == "staging" ]]; then
            echo "The staging web build must use the isolated staging API." >&2
            exit 1
          fi
          if [[ ! "${{ inputs.source_commit }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be a full lowercase Git commit SHA." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_commit }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24

      - run: npm ci --ignore-scripts

      - name: Build and audit the browser member app
        working-directory: apps/member-app
        env:
          CI: "1"
          EXPO_PUBLIC_API_URL: ${{ env.API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run audit:production-bundle -- dist
          npm run audit:demo-isolation
          npm run audit:browser-pilot-release -- dist

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.MEMBER_WEB_DEPLOY_ROLE_ARN }}
          role-session-name: gogymgo-member-web-${{ inputs.environment }}-${{ github.run_id }}

      - name: Verify the isolated AWS target
        shell: bash
        run: |
          set -euo pipefail
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$actual_account" != "$AWS_ACCOUNT_ID" ]]; then
            echo "OIDC assumed account ${actual_account}; expected ${AWS_ACCOUNT_ID}." >&2
            exit 1
          fi

      - name: Publish immutable assets and the no-cache entrypoint
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync apps/member-app/dist "s3://${MEMBER_WEB_BUCKET}" \
            --delete \
            --exclude index.html \
            --cache-control 'public,max-age=3600'
          aws s3 cp apps/member-app/dist/index.html "s3://${MEMBER_WEB_BUCKET}/index.html" \
            --cache-control 'no-store,max-age=0' \
            --content-type 'text/html; charset=utf-8'
          if [[ -d apps/member-app/dist/_expo/static ]]; then
            aws s3 cp apps/member-app/dist/_expo/static "s3://${MEMBER_WEB_BUCKET}/_expo/static" \
              --recursive \
              --cache-control 'public,max-age=31536000,immutable'
          fi
          for key in \
            .well-known/apple-app-site-association \
            .well-known/assetlinks.json; do
            if aws s3api head-object \
              --bucket "$MEMBER_WEB_BUCKET" \
              --key "$key" > /dev/null 2>&1; then
              echo "Browser-only pilot must not publish ${key}." >&2
              exit 1
            fi
          done

      - name: Invalidate and verify browser routes
        shell: bash
        run: |
          set -euo pipefail
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$MEMBER_WEB_DISTRIBUTION_ID" \
            --paths '/*' \
            --query Invalidation.Id \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$MEMBER_WEB_DISTRIBUTION_ID" \
            --id "$invalidation_id"
          for route in sign-up join demo scan profile winners-circle; do
            curl --fail --show-error --silent \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 5 \
              "${MEMBER_WEB_URL}/${route}" > /dev/null
          done
