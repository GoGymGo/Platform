name: Platform Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
      source_commit:
        description: Merged main commit SHA to build and deploy
        required: true
        type: string
      scope:
        description: Workload to deploy
        required: true
        default: platform
        type: choice
        options:
          - platform
          - member-web
          - member-native-links
          - pilot-configuration

permissions: {}

concurrency:
  group: gogymgo-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  authorize_source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Authorize the reviewed main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/deployment-source-policy.mjs "${{ inputs.source_commit }}"

  deploy:
    needs: authorize_source
    if: needs.authorize_source.result == 'success' && inputs.scope == 'platform'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.environment }}
    env:
      API_URL: ${{ vars.API_URL }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE }}
      ECS_API_TASK_DEFINITION: ${{ vars.ECS_API_TASK_DEFINITION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_MIGRATION_SECURITY_GROUPS: ${{ vars.ECS_MIGRATION_SECURITY_GROUPS }}
      ECS_MIGRATION_SUBNETS: ${{ vars.ECS_MIGRATION_SUBNETS }}
      ECS_MIGRATION_TASK_DEFINITION: ${{ vars.ECS_MIGRATION_TASK_DEFINITION }}
      ECS_WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE }}
      ECS_WORKER_TASK_DEFINITION: ${{ vars.ECS_WORKER_TASK_DEFINITION }}
    steps:
      - name: Validate protected environment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            API_URL \
            AWS_ACCOUNT_ID \
            AWS_DEPLOY_ROLE_ARN \
            AWS_REGION \
            ECR_REPOSITORY \
            ECS_API_SERVICE \
            ECS_API_TASK_DEFINITION \
            ECS_CLUSTER \
            ECS_MIGRATION_SECURITY_GROUPS \
            ECS_MIGRATION_SUBNETS \
            ECS_MIGRATION_TASK_DEFINITION \
            ECS_WORKER_SERVICE \
            ECS_WORKER_TASK_DEFINITION; do
            if [[ -z "${!name:-}" ]]; then
              echo "The protected environment must define ${name}." >&2
              exit 1
            fi
          done
          if [[ "$AWS_REGION" != "ca-central-1" ]]; then
            echo "GoGymGo releases are restricted to ca-central-1." >&2
            exit 1
          fi
          if [[ ! "${{ inputs.source_commit }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be a full lowercase Git commit SHA." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit }}

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gogymgo-${{ inputs.environment }}-${{ github.run_id }}

      - name: Verify the isolated account
        shell: bash
        run: |
          set -euo pipefail
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$actual_account" != "$AWS_ACCOUNT_ID" ]]; then
            echo "OIDC assumed account ${actual_account}; expected ${AWS_ACCOUNT_ID}." >&2
            exit 1
          fi

      - name: Verify staged task-definition safety
        shell: bash
        run: |
          set -euo pipefail
          api_definition="$(aws ecs describe-task-definition \
            --task-definition "$ECS_API_TASK_DEFINITION")"
          worker_definition="$(aws ecs describe-task-definition \
            --task-definition "$ECS_WORKER_TASK_DEFINITION")"
          migration_definition="$(aws ecs describe-task-definition \
            --task-definition "$ECS_MIGRATION_TASK_DEFINITION")"

          expected_api_execution_role="arn:aws:iam::${AWS_ACCOUNT_ID}:role/gogymgo-${{ inputs.environment }}-ecs-execution-api"
          expected_worker_execution_role="arn:aws:iam::${AWS_ACCOUNT_ID}:role/gogymgo-${{ inputs.environment }}-ecs-execution-worker"
          expected_migration_execution_role="arn:aws:iam::${AWS_ACCOUNT_ID}:role/gogymgo-${{ inputs.environment }}-ecs-execution-migration"
          for definition in api worker migration; do
            definition_json="${definition}_definition"
            expected_role="expected_${definition}_execution_role"
            status="$(jq -r '.taskDefinition.status' <<<"${!definition_json}")"
            execution_role="$(jq -r '.taskDefinition.executionRoleArn' <<<"${!definition_json}")"
            if [[ "$status" != "ACTIVE" || "$execution_role" != "${!expected_role}" ]]; then
              echo "${definition} base task definition must be ACTIVE and use its scoped execution role." >&2
              exit 1
            fi
          done

          owner_secret_count="$(jq \
            '[.taskDefinition.containerDefinitions[0].secrets[]? | select(.name == "GOGYMGO_OWNER_EMAIL")] | length' \
            <<<"$api_definition")"
          if [[ "$owner_secret_count" != "1" ]]; then
            echo "${ECS_API_TASK_DEFINITION} must map GOGYMGO_OWNER_EMAIL exactly once." >&2
            exit 1
          fi
          reward_secret_count="$(jq \
            '[.taskDefinition.containerDefinitions[0].secrets[]? | select(.name == "REWARD_CODE_ENCRYPTION_KEY")] | length' \
            <<<"$api_definition")"
          if [[ "$reward_secret_count" != "1" ]]; then
            echo "${ECS_API_TASK_DEFINITION} must map REWARD_CODE_ENCRYPTION_KEY exactly once." >&2
            exit 1
          fi
          worker_reward_secret_count="$(jq \
            '[.taskDefinition.containerDefinitions[0].secrets[]? | select(.name == "REWARD_CODE_ENCRYPTION_KEY")] | length' \
            <<<"$worker_definition")"
          if [[ "$worker_reward_secret_count" != "0" ]]; then
            echo "${ECS_WORKER_TASK_DEFINITION} must not map the API-only reward encryption key." >&2
            exit 1
          fi
          migration_secret_names="$(jq -c \
            '[.taskDefinition.containerDefinitions[0].secrets[]?.name] | sort' \
            <<<"$migration_definition")"
          if [[ "$migration_secret_names" != '["DATABASE_URL"]' ]]; then
            echo "${ECS_MIGRATION_TASK_DEFINITION} must map only DATABASE_URL." >&2
            exit 1
          fi

      - id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - id: image
        name: Build the exact source commit
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "${{ inputs.source_commit }}" ]]; then
            echo "Checkout resolved ${actual_commit}; expected ${{ inputs.source_commit }}." >&2
            exit 1
          fi
          image_tag="${ECR_REGISTRY}/${ECR_REPOSITORY}:${actual_commit}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --file services/api/Dockerfile --tag "$image_tag" .
          docker run --rm --entrypoint node "$image_tag" -e '
            const fs = require("node:fs");
            const certificatePath = process.env.NODE_EXTRA_CA_CERTS;
            if (!certificatePath) {
              throw new Error("NODE_EXTRA_CA_CERTS is not configured.");
            }
            const bundle = fs.readFileSync(certificatePath, "utf8");
            const certificateCount = bundle.match(/-----BEGIN CERTIFICATE-----/g)?.length ?? 0;
            if (certificateCount !== 3) {
              throw new Error(`Expected 3 RDS root certificates; found ${certificateCount}.`);
            }
          '
          docker run --rm --entrypoint node "$image_tag" \
            node_modules/node-pg-migrate/bin/node-pg-migrate.js --help > /dev/null
          echo "tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          exit-code: "1"
          format: table
          hide-progress: true
          image-ref: ${{ steps.image.outputs.tag }}
          ignore-unfixed: true
          scan-type: image
          severity: HIGH,CRITICAL

      - name: Push, pin, and verify the scanned image
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE_TAG"
          tag="${IMAGE_TAG##*:}"
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${tag}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ECR did not return a valid immutable digest." >&2
            exit 1
          fi
          aws ecr wait image-scan-complete \
            --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=${digest}"
          scan_findings="$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=${digest}")"
          scan_status="$(jq -r '.imageScanStatus.status' <<<"$scan_findings")"
          critical_findings="$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' <<<"$scan_findings")"
          high_findings="$(jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0' <<<"$scan_findings")"
          if [[ "$scan_status" != "COMPLETE" || "$critical_findings" != "0" || "$high_findings" != "0" ]]; then
            echo "ECR scan must complete with zero HIGH or CRITICAL findings." >&2
            exit 1
          fi
          image="${IMAGE_TAG%:*}@${digest}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"

      - name: Register and run the forward-only migration task
        shell: bash
        run: |
          set -euo pipefail
          aws ecs describe-task-definition \
            --task-definition "$ECS_MIGRATION_TASK_DEFINITION" \
            --query taskDefinition > migration-current.json
          jq --arg image "$IMAGE" '
            .containerDefinitions[0].image = $image
            | del(
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .requiresAttributes,
                .revision,
                .status,
                .taskDefinitionArn
              )
          ' migration-current.json > migration-next.json
          migration_definition="$(aws ecs register-task-definition \
            --cli-input-json file://migration-next.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"
          task_arn="$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${ECS_MIGRATION_SUBNETS}],securityGroups=[${ECS_MIGRATION_SECURITY_GROUPS}],assignPublicIp=ENABLED}" \
            --task-definition "$migration_definition" \
            --query 'tasks[0].taskArn' \
            --output text)"
          if [[ -z "$task_arn" || "$task_arn" == "None" ]]; then
            echo "ECS did not start the migration task." >&2
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)"
          if [[ "$exit_code" != "0" ]]; then
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$task_arn" \
              --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[*].{name:name,reason:reason,exitCode:exitCode}}'
            exit 1
          fi

      - name: Deploy the worker revision
        shell: bash
        run: |
          set -euo pipefail
          worker_previous_state="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_WORKER_SERVICE" \
            --query 'services[0]' \
            --output json)"
          worker_previous_definition="$(jq -r '.taskDefinition' <<<"$worker_previous_state")"
          worker_previous_desired_count="$(jq -r '.desiredCount' <<<"$worker_previous_state")"
          worker_previous_status="$(aws ecs describe-task-definition \
            --task-definition "$worker_previous_definition" \
            --query 'taskDefinition.status' \
            --output text)"
          if [[ ! "$worker_previous_definition" =~ ^arn:aws:ecs:ca-central-1:${AWS_ACCOUNT_ID}:task-definition/ ]] ||
             [[ ! "$worker_previous_desired_count" =~ ^[0-1]$ ]] ||
             [[ "$worker_previous_status" != "ACTIVE" ]]; then
            echo "The worker service did not return a safe rollback baseline." >&2
            exit 1
          fi
          echo "WORKER_PREVIOUS_TASK_DEFINITION=${worker_previous_definition}" >> "$GITHUB_ENV"
          echo "WORKER_PREVIOUS_DESIRED_COUNT=${worker_previous_desired_count}" >> "$GITHUB_ENV"

          rollback_worker() {
            local recovery_status=0
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_WORKER_SERVICE" \
              --task-definition "$worker_previous_definition" \
              --desired-count "$worker_previous_desired_count" \
              --force-new-deployment > /dev/null || recovery_status=1
            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_WORKER_SERVICE" || recovery_status=1
            return "$recovery_status"
          }

          rollback_worker_on_error() {
            local exit_code=$?
            trap - ERR
            rollback_worker || echo "Worker rollback also failed; operator intervention is required." >&2
            exit "$exit_code"
          }
          trap rollback_worker_on_error ERR

          aws ecs describe-task-definition \
            --task-definition "$ECS_WORKER_TASK_DEFINITION" \
            --query taskDefinition > worker-current.json
          jq --arg image "$IMAGE" '
            .containerDefinitions[0].image = $image
            | del(
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .requiresAttributes,
                .revision,
                .status,
                .taskDefinitionArn
              )
          ' worker-current.json > worker-next.json
          worker_definition="$(aws ecs register-task-definition \
            --cli-input-json file://worker-next.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WORKER_SERVICE" \
            --task-definition "$worker_definition" \
            --desired-count 1 \
            --force-new-deployment > /dev/null
          if ! aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_WORKER_SERVICE"; then
            trap - ERR
            rollback_worker || echo "Worker rollback also failed; operator intervention is required." >&2
            echo "The worker failed to stabilize and the prior service baseline was requested." >&2
            exit 1
          fi
          worker_rollout_complete=false
          for attempt in {1..18}; do
            worker_state="$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_WORKER_SERVICE" \
              --query 'services[0]' \
              --output json)"
            worker_actual_definition="$(jq -r '.taskDefinition' <<<"$worker_state")"
            worker_rollout_state="$(jq -r '[.deployments[] | select(.status == "PRIMARY")][0].rolloutState // "UNKNOWN"' <<<"$worker_state")"
            worker_desired_count="$(jq -r '.desiredCount' <<<"$worker_state")"
            worker_running_count="$(jq -r '.runningCount' <<<"$worker_state")"
            if [[ "$worker_actual_definition" != "$worker_definition" ]]; then
              break
            fi
            if [[ "$worker_rollout_state" == "COMPLETED" &&
                  "$worker_desired_count" == "1" &&
                  "$worker_running_count" == "1" ]]; then
              worker_rollout_complete=true
              break
            fi
            if [[ "$attempt" -lt 18 ]]; then
              sleep 10
            fi
          done
          if [[ "$worker_rollout_complete" != "true" ]]; then
            trap - ERR
            jq '{
              requestedTaskDefinition: $requested,
              actualTaskDefinition: .taskDefinition,
              desiredCount,
              runningCount,
              primaryDeployment: ([.deployments[] | select(.status == "PRIMARY")][0]),
              recentEvents: [.events[0:10][]?.message]
            }' --arg requested "$worker_definition" <<<"$worker_state"
            rollback_worker || echo "Worker rollback also failed; operator intervention is required." >&2
            echo "The worker did not reach the requested task definition; the prior baseline was requested." >&2
            exit 1
          fi
          trap - ERR

      - name: Deploy the API with circuit-breaker rollback
        shell: bash
        run: |
          set -euo pipefail
          api_previous_state="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_API_SERVICE" \
            --query 'services[0]' \
            --output json)"
          api_previous_definition="$(jq -r '.taskDefinition' <<<"$api_previous_state")"
          api_previous_desired_count="$(jq -r '.desiredCount' <<<"$api_previous_state")"
          api_previous_status="$(aws ecs describe-task-definition \
            --task-definition "$api_previous_definition" \
            --query 'taskDefinition.status' \
            --output text)"
          if [[ ! "$api_previous_definition" =~ ^arn:aws:ecs:ca-central-1:${AWS_ACCOUNT_ID}:task-definition/ ]] ||
             [[ ! "$api_previous_desired_count" =~ ^[0-4]$ ]] ||
             [[ "$api_previous_status" != "ACTIVE" ]]; then
            echo "The API service did not return a safe rollback baseline." >&2
            exit 1
          fi
          echo "API_PREVIOUS_TASK_DEFINITION=${api_previous_definition}" >> "$GITHUB_ENV"
          echo "API_PREVIOUS_DESIRED_COUNT=${api_previous_desired_count}" >> "$GITHUB_ENV"

          rollback_release() {
            local recovery_status=0
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_API_SERVICE" \
              --task-definition "$api_previous_definition" \
              --desired-count "$api_previous_desired_count" \
              --force-new-deployment > /dev/null || recovery_status=1
            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_API_SERVICE" || recovery_status=1
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$ECS_WORKER_SERVICE" \
              --task-definition "$WORKER_PREVIOUS_TASK_DEFINITION" \
              --desired-count "$WORKER_PREVIOUS_DESIRED_COUNT" \
              --force-new-deployment > /dev/null || recovery_status=1
            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_WORKER_SERVICE" || recovery_status=1
            return "$recovery_status"
          }

          rollback_release_on_error() {
            local exit_code=$?
            trap - ERR
            rollback_release || echo "Release rollback also failed; operator intervention is required." >&2
            exit "$exit_code"
          }
          trap rollback_release_on_error ERR

          aws ecs describe-task-definition \
            --task-definition "$ECS_API_TASK_DEFINITION" \
            --query taskDefinition > api-current.json
          jq --arg image "$IMAGE" '
            .containerDefinitions[0].image = $image
            | del(
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .requiresAttributes,
                .revision,
                .status,
                .taskDefinitionArn
              )
          ' api-current.json > api-next.json
          api_definition="$(aws ecs register-task-definition \
            --cli-input-json file://api-next.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_API_SERVICE" \
            --task-definition "$api_definition" \
            --desired-count 1 \
            --deployment-configuration 'deploymentCircuitBreaker={enable=true,rollback=true},minimumHealthyPercent=100,maximumPercent=200' \
            --force-new-deployment > /dev/null
          if ! aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_API_SERVICE"; then
            trap - ERR
            rollback_release || echo "Release rollback also failed; operator intervention is required." >&2
            echo "The API failed to stabilize; both prior service baselines were requested." >&2
            exit 1
          fi
          api_rollout_complete=false
          for attempt in {1..18}; do
            api_state="$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_API_SERVICE" \
              --query 'services[0]' \
              --output json)"
            api_actual_definition="$(jq -r '.taskDefinition' <<<"$api_state")"
            api_rollout_state="$(jq -r '[.deployments[] | select(.status == "PRIMARY")][0].rolloutState // "UNKNOWN"' <<<"$api_state")"
            api_desired_count="$(jq -r '.desiredCount' <<<"$api_state")"
            api_running_count="$(jq -r '.runningCount' <<<"$api_state")"
            if [[ "$api_actual_definition" != "$api_definition" ]]; then
              break
            fi
            if [[ "$api_rollout_state" == "COMPLETED" &&
                  "$api_desired_count" == "1" &&
                  "$api_running_count" == "1" ]]; then
              api_rollout_complete=true
              break
            fi
            if [[ "$attempt" -lt 18 ]]; then
              sleep 10
            fi
          done
          if [[ "$api_rollout_complete" != "true" ]]; then
            trap - ERR
            jq '{
              requestedTaskDefinition: $requested,
              actualTaskDefinition: .taskDefinition,
              desiredCount,
              runningCount,
              primaryDeployment: ([.deployments[] | select(.status == "PRIMARY")][0]),
              recentEvents: [.events[0:10][]?.message]
            }' --arg requested "$api_definition" <<<"$api_state"
            rollback_release || echo "Release rollback also failed; operator intervention is required." >&2
            echo "The API did not reach the requested task definition; both prior service baselines were requested." >&2
            exit 1
          fi
          trap - ERR

      - name: Verify API and worker readiness
        shell: bash
        run: |
          set -euo pipefail
          if curl --fail --show-error --silent \
            --retry 18 \
            --retry-all-errors \
            --retry-delay 10 \
            "${API_URL}/v1/health/ready"; then
            exit 0
          fi

          recovery_status=0
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_API_SERVICE" \
            --task-definition "$API_PREVIOUS_TASK_DEFINITION" \
            --desired-count "$API_PREVIOUS_DESIRED_COUNT" \
            --force-new-deployment > /dev/null || recovery_status=1
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_API_SERVICE" || recovery_status=1
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WORKER_SERVICE" \
            --task-definition "$WORKER_PREVIOUS_TASK_DEFINITION" \
            --desired-count "$WORKER_PREVIOUS_DESIRED_COUNT" \
            --force-new-deployment > /dev/null || recovery_status=1
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_WORKER_SERVICE" || recovery_status=1
          if [[ "$recovery_status" != "0" ]]; then
            echo "Readiness failed and automatic release rollback was incomplete." >&2
          else
            echo "Readiness failed; both prior service baselines were restored." >&2
          fi
          exit 1

  member-web:
    needs: authorize_source
    if: needs.authorize_source.result == 'success' && inputs.scope == 'member-web'
    permissions:
      checks: read
      contents: read
      id-token: write
      pull-requests: read
      statuses: read
    uses: ./.github/workflows/member-web-deployment.yml
    with:
      environment: ${{ inputs.environment }}
      release_mode: browser-pilot
      source_commit: ${{ inputs.source_commit }}

  member-native-links:
    needs: authorize_source
    if: needs.authorize_source.result == 'success' && inputs.scope == 'member-native-links'
    permissions:
      checks: read
      contents: read
      id-token: write
      pull-requests: read
      statuses: read
    uses: ./.github/workflows/member-web-deployment.yml
    with:
      environment: ${{ inputs.environment }}
      release_mode: native-links
      source_commit: ${{ inputs.source_commit }}

  pilot-configuration:
    needs: authorize_source
    if: needs.authorize_source.result == 'success' && inputs.scope == 'pilot-configuration'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment:
      name: ${{ inputs.environment }}
    env:
      API_URL: ${{ vars.API_URL }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_API_TASK_DEFINITION: ${{ vars.ECS_API_TASK_DEFINITION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_MIGRATION_SECURITY_GROUPS: ${{ vars.ECS_MIGRATION_SECURITY_GROUPS }}
      ECS_MIGRATION_SUBNETS: ${{ vars.ECS_MIGRATION_SUBNETS }}
      ECS_MIGRATION_TASK_DEFINITION: ${{ vars.ECS_MIGRATION_TASK_DEFINITION }}
    steps:
      - name: Validate the staging configuration target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.environment }}" != "staging" ]]; then
            echo "The September pilot configuration is restricted to staging." >&2
            exit 1
          fi
          for name in \
            API_URL \
            AWS_ACCOUNT_ID \
            AWS_DEPLOY_ROLE_ARN \
            AWS_REGION \
            ECR_REPOSITORY \
            ECS_API_TASK_DEFINITION \
            ECS_CLUSTER \
            ECS_MIGRATION_SECURITY_GROUPS \
            ECS_MIGRATION_SUBNETS; do
            if [[ -z "${!name:-}" ]]; then
              echo "The protected environment must define ${name}." >&2
              exit 1
            fi
          done
          if [[ "$AWS_REGION" != "ca-central-1" ]]; then
            echo "GoGymGo releases are restricted to ca-central-1." >&2
            exit 1
          fi
          if [[ ! "${{ inputs.source_commit }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be a full lowercase Git commit SHA." >&2
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gogymgo-pilot-configuration-${{ github.run_id }}

      - name: Verify the isolated account and deployed commit
        shell: bash
        run: |
          set -euo pipefail
          actual_account="$(aws sts get-caller-identity --query Account --output text)"
          if [[ "$actual_account" != "$AWS_ACCOUNT_ID" ]]; then
            echo "OIDC assumed account ${actual_account}; expected ${AWS_ACCOUNT_ID}." >&2
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$ECS_API_TASK_DEFINITION" \
            --query taskDefinition > pilot-task.json
          image="$(jq -r '.containerDefinitions[0].image' pilot-task.json)"
          digest="${image##*@}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The migration task is not pinned to an immutable image digest." >&2
            exit 1
          fi
          if ! aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageDigest=${digest}" \
              --query 'imageDetails[0].imageTags' \
              --output text | tr '\t' '\n' | grep -q "^${{ inputs.source_commit }}-"; then
            echo "The migration task image was not built from the requested source commit." >&2
            exit 1
          fi

      - name: Apply the Vancouver Island pilot configuration
        shell: bash
        run: |
          set -euo pipefail
          container_name="$(jq -r '.containerDefinitions[0].name' pilot-task.json)"
          overrides="$(jq -nc --arg name "$container_name" '{
            containerOverrides: [{
              name: $name,
              command: ["node", "dist/operations/configure-september-2026-island-pilot.js"],
              environment: [{name: "APPLY_PILOT_CONFIGURATION", value: "yes"}]
            }]
          }')"
          task_arn="$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${ECS_MIGRATION_SUBNETS}],securityGroups=[${ECS_MIGRATION_SECURITY_GROUPS}],assignPublicIp=ENABLED}" \
            --task-definition "$ECS_API_TASK_DEFINITION" \
            --overrides "$overrides" \
            --query 'tasks[0].taskArn' \
            --output text)"
          if [[ -z "$task_arn" || "$task_arn" == "None" ]]; then
            echo "ECS did not start the pilot-configuration task." >&2
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          exit_code="$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)"
          if [[ "$exit_code" != "0" ]]; then
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$task_arn" \
              --query 'tasks[0].{stoppedReason:stoppedReason,containers:containers[*].{name:name,reason:reason,exitCode:exitCode}}'
            exit 1
          fi

      - name: Verify the active pilot region
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            "${API_URL}/v1/regions" \
            | jq -e '.[] | select(
                .code == "vancouver-island-gulf-islands-bc" and
                .competitionEnabled == true and
                .policyVersion == "2026-09-pilot-v1"
              )' > /dev/null
