name: Admin CI

on:
  schedule:
    - cron: "17 16 * * 1"
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/brand/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-ci.yml"

permissions:
  contents: read

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run check --workspace @gogymgo/admin
      - run: npm run audit:production-bundle --workspace @gogymgo/admin
      - run: npm run audit:dependencies --workspace @gogymgo/admin
