name: Backend deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
      image:
        description: Full Artifact Registry image pinned to @sha256
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
    env:
      BACKEND_NAME_PREFIX: ${{ vars.BACKEND_NAME_PREFIX || 'gogymgo' }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate immutable image input
        shell: bash
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?The protected environment must define GCP_PROJECT_ID.}"
          : "${GCP_REGION:?The protected environment must define GCP_REGION.}"
          if [[ ! "$IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]; then
            echo "The image must be pinned to a lowercase sha256 digest." >&2
            exit 1
          fi
          expected_prefix="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${BACKEND_NAME_PREFIX}-backend/"
          if [[ "$IMAGE" != "${expected_prefix}"* ]]; then
            echo "The image must come from this environment's backend repository." >&2
            exit 1
          fi

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          version: latest

      - name: Verify the image exists in Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          gcloud artifacts docker images describe "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --quiet

      - name: Run forward-only database migrations
        shell: bash
        run: |
          set -euo pipefail
          name="${BACKEND_NAME_PREFIX}-${DEPLOY_ENVIRONMENT}"
          gcloud run jobs update "${name}-migration" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --quiet
          gcloud run jobs execute "${name}-migration" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait

      - name: Deploy the continuous worker revision
        shell: bash
        run: |
          set -euo pipefail
          name="${BACKEND_NAME_PREFIX}-${DEPLOY_ENVIRONMENT}"
          gcloud run worker-pools deploy "${name}-operations" \
            --image "$IMAGE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --quiet

      - name: Deploy an API candidate with no user traffic
        shell: bash
        run: |
          set -euo pipefail
          name="${BACKEND_NAME_PREFIX}-${DEPLOY_ENVIRONMENT}"
          candidate_tag="candidate-${GITHUB_RUN_NUMBER}"
          gcloud run deploy "${name}-api" \
            --image "$IMAGE" \
            --no-traffic \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --tag "$candidate_tag" \
            --quiet
          candidate_url="$(gcloud run services describe "${name}-api" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format=json | jq -r --arg tag "$candidate_tag" \
            '.status.traffic[] | select(.tag == $tag) | .url')"
          if [[ -z "$candidate_url" || "$candidate_url" == "null" ]]; then
            echo "Cloud Run did not return the candidate revision URL." >&2
            exit 1
          fi
          echo "CANDIDATE_TAG=$candidate_tag" >> "$GITHUB_ENV"
          echo "CANDIDATE_URL=$candidate_url" >> "$GITHUB_ENV"

      - name: Verify the candidate and worker readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            --retry 18 \
            --retry-all-errors \
            --retry-delay 10 \
            "${CANDIDATE_URL}/v1/health/ready"

      - name: Promote the verified API revision
        shell: bash
        run: |
          set -euo pipefail
          name="${BACKEND_NAME_PREFIX}-${DEPLOY_ENVIRONMENT}"
          gcloud run services update-traffic "${name}-api" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --to-latest \
            --quiet
          api_url="$(gcloud run services describe "${name}-api" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(uri)')"
          curl --fail --show-error --silent \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 10 \
            "${api_url}/v1/health/ready"
          gcloud run services update-traffic "${name}-api" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --remove-tags "$CANDIDATE_TAG" \
            --quiet
