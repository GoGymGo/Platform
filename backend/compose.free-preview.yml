services:
  migrate:
    command:
      - sh
      - -ec
      - |
        attempt=1
        until node node_modules/node-pg-migrate/bin/node-pg-migrate.js up \
          --migrations-dir dist/migrations \
          --database-url-var DATABASE_URL
        do
          if [ "$$attempt" -ge 12 ]; then
            exit 1
          fi
          attempt=$$((attempt + 1))
          sleep 2
        done

  api:
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${GOGYMGO_PREVIEW_CORS_ORIGINS:-http://localhost:8081,http://localhost:19006,http://localhost:19000}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in backend/.env}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcloud-adc.json
      TRUST_PROXY: 'true'
    volumes:
      - type: bind
        source: ${GOGYMGO_GOOGLE_ADC_PATH:?Set GOGYMGO_GOOGLE_ADC_PATH to the local ADC file}
        target: /run/secrets/gcloud-adc.json
        read_only: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/v1/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  worker:
    restart: unless-stopped
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set FIREBASE_PROJECT_ID in backend/.env}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcloud-adc.json
    volumes:
      - type: bind
        source: ${GOGYMGO_GOOGLE_ADC_PATH:?Set GOGYMGO_GOOGLE_ADC_PATH to the local ADC file}
        target: /run/secrets/gcloud-adc.json
        read_only: true

  tunnel:
    image: cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    command: ['tunnel', '--no-autoupdate', '--url', 'http://api:3000']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web-tunnel:
    image: cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    command:
      ['tunnel', '--no-autoupdate', '--url', 'http://host.docker.internal:8081']
    restart: unless-stopped
