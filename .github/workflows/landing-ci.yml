name: Landing CI

on:
  pull_request:
    paths:
      - "apps/landing/**"
      - "packages/brand/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/landing-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "packages/brand/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/landing-ci.yml"

permissions:
  contents: read

concurrency:
  group: landing-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run check --workspace @gogymgo/landing
