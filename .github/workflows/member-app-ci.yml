name: Member App CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/member-app/**"
      - "packages/brand/**"
      - "packages/contracts/**"
      - "services/api/openapi.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/member-app-ci.yml"

permissions:
  contents: read

concurrency:
  group: member-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  member-app-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/member-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm run check
      - run: npx expo install --check
      - run: npm run audit:dependencies
      - run: npx expo export --platform all --output-dir .expo-ci-export
        env:
          CI: "1"
      - run: npm run audit:production-bundle -- .expo-ci-export
