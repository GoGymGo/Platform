name: Member App CI

on:
  pull_request:
    paths:
      - "apps/member-app/**"
      - "packages/brand/**"
      - "packages/contracts/**"
      - "services/api/openapi.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/member-app-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/member-app/**"
      - "packages/brand/**"
      - "packages/contracts/**"
      - "services/api/openapi.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/member-app-ci.yml"

permissions:
  contents: read

concurrency:
  group: member-app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/member-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm run check
      - run: npx expo install --check
      - run: npm audit --omit=dev
      - run: npx expo export --platform all --output-dir .expo-ci-export
        env:
          CI: "1"
      - run: npm run audit:production-bundle -- .expo-ci-export
