name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-deploy.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: backend/package-lock.json
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform test
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: "1"
          format: table
          hide-progress: true
          scan-ref: backend/infra/terraform
          scan-type: config
          severity: HIGH,CRITICAL
      - run: npm run check
        env:
          RUN_DATABASE_INTEGRATION: "true"
      - run: npm run audit:deps
      - run: docker compose config --quiet
        env:
          REWARD_CODE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - run: docker build --tag gogymgo-api:ci .
