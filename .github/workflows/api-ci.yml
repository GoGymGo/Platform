name: API CI

on:
  pull_request:
    paths:
      - "services/api/**"
      - "infrastructure/gcp/terraform/**"
      - "infrastructure/aws/terraform/**"
      - "infrastructure/aws/firebase-wif/**"
      - "infrastructure/local/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/deployment.yml"
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "infrastructure/gcp/terraform/**"
      - "infrastructure/aws/terraform/**"
      - "infrastructure/aws/firebase-wif/**"
      - "infrastructure/local/**"
      - "packages/contracts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/deployment.yml"

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: terraform -chdir=infrastructure/gcp/terraform fmt -check -recursive
      - run: terraform -chdir=infrastructure/gcp/terraform init -backend=false -input=false
      - run: terraform -chdir=infrastructure/gcp/terraform validate
      - run: terraform -chdir=infrastructure/gcp/terraform test
      - run: terraform -chdir=infrastructure/aws/terraform fmt -check -recursive
      - run: terraform -chdir=infrastructure/aws/terraform init -backend=false -input=false
      - run: terraform -chdir=infrastructure/aws/terraform validate
      - run: terraform -chdir=infrastructure/aws/terraform test
      - run: bash infrastructure/aws/firebase-wif/test.sh
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: "1"
          format: table
          hide-progress: true
          scan-ref: infrastructure/gcp/terraform
          scan-type: config
          severity: HIGH,CRITICAL
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: "1"
          format: table
          hide-progress: true
          scan-ref: infrastructure/aws/terraform
          scan-type: config
          severity: HIGH,CRITICAL
      - run: npm run check --workspace @gogymgo/api
        env:
          RUN_DATABASE_INTEGRATION: "true"
      - run: npm run audit:deps --workspace @gogymgo/api
      - run: docker compose -f infrastructure/local/compose.yml config --quiet
        env:
          REWARD_CODE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      - run: docker build --file services/api/Dockerfile --tag gogymgo-api:ci .
      - name: Verify production image runtime dependencies
        run: |
          docker run --rm --entrypoint node gogymgo-api:ci -e '
            const fs = require("node:fs");
            const certificatePath = process.env.NODE_EXTRA_CA_CERTS;
            if (!certificatePath) {
              throw new Error("NODE_EXTRA_CA_CERTS is not configured.");
            }
            const bundle = fs.readFileSync(certificatePath, "utf8");
            const certificateCount = bundle.match(/-----BEGIN CERTIFICATE-----/g)?.length ?? 0;
            if (certificateCount !== 3) {
              throw new Error(`Expected 3 RDS root certificates; found ${certificateCount}.`);
            }
          '
          docker run --rm --entrypoint node gogymgo-api:ci \
            node_modules/node-pg-migrate/bin/node-pg-migrate.js --help
